name: Build Android & Windows

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android APK
            os: ubuntu-24.04
            target: android
            java: '17'
            artifact: Vale-Android-APK
            path: app/build/outputs/apk/debug/*.apk
          - name: Windows EXE
            os: windows-2022
            target: windows
            java: '21'
            artifact: Vale-Windows-EXE
            path: app/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Add WiX to PATH (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Include verified Tor Expert Bundle (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP\tor-expert-bundle.tar.gz"
          Invoke-WebRequest -Uri "https://archive.torproject.org/tor-package-archive/torbrowser/15.0.25/tor-expert-bundle-windows-x86_64-15.0.25.tar.gz" -OutFile $bundle
          $expected = "c1988c701de2f24f7d098d1d6d7f507b58f27740d097f29c246e0524d639b252"
          if ((Get-FileHash -Algorithm SHA256 $bundle).Hash.ToLowerInvariant() -ne $expected) { throw "Tor Expert Bundle checksum mismatch" }
          New-Item -ItemType Directory -Force "app/packaging/windows/tor-bundle" | Out-Null
          tar -xzf $bundle -C "app/packaging/windows/tor-bundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem "app/packaging/windows/tor-bundle" -Filter tor.exe -Recurse | Select-Object -First 1)) { throw "tor.exe missing from bundle" }
      - name: Build Android debug APK
        if: matrix.target == 'android'
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/vale-build.log"
          exit "${PIPESTATUS[0]}"
      - name: Test and package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\gradlew.bat :app:desktopTest :app:createDistributable :app:packageExe --stacktrace 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\vale-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test packaged Windows runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $launcher = Get-ChildItem "app/build/compose/binaries/main/app" -Filter Vale.exe -Recurse | Select-Object -First 1
          if (-not $launcher) { throw "Packaged launcher was not found" }
          $process = Start-Process -FilePath $launcher.FullName -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged runtime self-test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged runtime self-test failed: $($process.ExitCode)" }
      - name: Annotate build failures
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/vale-build.log" ]; then
            sed -r 's/\x1B\[[0-9;]*[mK]//g' "$RUNNER_TEMP/vale-build.log" | grep -E '(^e:|^\* What went wrong|^> (Could not|Execution failed|Compilation error)|^Caused by:| FAILED|[Ee]rror:|Unresolved reference|only compatible|Could not|Cannot)' | head -9 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::$line"
            done || true
          fi
      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Android emulator smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v7
        with:
          name: Vale-Android-APK
          path: incoming-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and create a profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-smoke.sh incoming-apk
