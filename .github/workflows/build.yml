name: Build VOXEL VPN

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  core:
    name: Xray-core AAR (Go + gomobile)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/go/go.mod
          cache-dependency-path: app/src/main/go/go.sum

      - name: Go vet and tests of the core facade
        working-directory: app/src/main/go
        run: |
          go vet ./...
          go test ./... -count=1 -v

      # The AAR is handed to the app job through the Actions cache: it is keyed by the sources it is built from,
      # so unchanged Go sources skip the slow gomobile build, and no artifact storage is used.
      - name: Cache key of the AAR
        id: key
        run: echo "value=voxelcore-aar-${NDK_VERSION}-${{ hashFiles('app/src/main/go/go.mod', 'app/src/main/go/go.sum', 'app/src/main/go/voxelcore.go', 'app/src/main/go/build-aar.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Look for an AAR built from these sources
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: app/libs/voxelcore.aar
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - uses: android-actions/setup-android@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools ndk;${{ env.NDK_VERSION }}"

      - name: Build voxelcore.aar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash app/src/main/go/build-aar.sh

      - name: Keep the AAR for the app job
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/libs/voxelcore.aar
          key: ${{ steps.key.outputs.value }}

  dpi:
    # The C++ DPI engine (app/src/main/cpp) built for the runner with AddressSanitizer and UndefinedBehaviorSanitizer,
    # its unit tests, and a network lab: four network namespaces with a DPI box in the middle that resets every TLS
    # connection whose first packets carry a blocked server name. The lab shows that the engine gets a connection
    # through that the plain client cannot, and that the weaker presets stay blocked by the stronger inspectors.
    name: DPI engine (C++ build, unit tests, network lab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the build and lab tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build iproute2 openssl curl iputils-ping
          # Kernels with a 32 bit mmap entropy break the sanitizers' shadow memory layout at start-up.
          sudo sysctl -q vm.mmap_rnd_bits=28 || true
          echo "::notice title=Tools::$(cmake --version | sed -n 1p), $(g++ --version | sed -n 1p), $(openssl version), kernel $(uname -r), $(nproc) CPUs"

      - name: Build (sanitizers, warnings are errors)
        id: build
        run: |
          set -o pipefail
          {
            cmake -S app/src/main/cpp -B "$RUNNER_TEMP/dpi" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DVOXEL_DPI_SANITIZE=ON -DVOXEL_DPI_WERROR=ON
            cmake --build "$RUNNER_TEMP/dpi"
          } 2>&1 | tee "$RUNNER_TEMP/dpi-build.log"

      - name: Report the build failure
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/dpi-build.log" "DPI engine build"

      - name: Unit tests
        id: unit
        run: |
          set -o pipefail
          "$RUNNER_TEMP/dpi/voxel-dpi-tests" 2>&1 | tee "$RUNNER_TEMP/dpi-unit.log"

      - name: Report the unit test failure
        if: failure() && steps.unit.outcome == 'failure'
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/dpi-unit.log" "DPI engine unit tests"

      - name: Unit test totals
        if: always() && steps.unit.outcome != 'skipped'
        run: echo "::notice title=DPI unit tests::$(grep -E '^[0-9]+ tests, ' "$RUNNER_TEMP/dpi-unit.log" | tail -n 1)"

      - name: Network lab
        id: lab
        run: |
          set -o pipefail
          sudo python3 .github/scripts/dpi_lab.py --engine "$RUNNER_TEMP/dpi/voxel-dpi" --report "$RUNNER_TEMP/dpi-lab.txt" 2>&1 | tee "$RUNNER_TEMP/dpi-lab.log"

      - name: Report the lab failure
        if: failure() && steps.lab.outcome == 'failure'
        run: |
          tail -n 60 "$RUNNER_TEMP/dpi-lab.log" | python3 -c 'import sys; print("::error title=DPI lab::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'

      - name: Lab report
        if: always() && steps.lab.outcome != 'skipped'
        run: |
          [ -f "$RUNNER_TEMP/dpi-lab.txt" ] || exit 0
          head -c 12000 "$RUNNER_TEMP/dpi-lab.txt" | python3 -c 'import sys; print("::notice title=DPI lab report::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'

  app:
    name: Android app (unit tests, Xray config check, APK)
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Cache key of the AAR
        id: key
        run: echo "value=voxelcore-aar-${NDK_VERSION}-${{ hashFiles('app/src/main/go/go.mod', 'app/src/main/go/go.sum', 'app/src/main/go/voxelcore.go', 'app/src/main/go/build-aar.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Fetch voxelcore.aar
        uses: actions/cache/restore@v6
        with:
          path: app/libs/voxelcore.aar
          key: ${{ steps.key.outputs.value }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Public API of the gomobile binding
        run: |
          unzip -p app/libs/voxelcore.aar classes.jar > "$RUNNER_TEMP/voxelcore-classes.jar"
          api="$(javap -cp "$RUNNER_TEMP/voxelcore-classes.jar" voxelcore.Voxelcore voxelcore.LogSink)"
          echo "$api"
          echo "::notice title=voxelcore API::$(printf '%s' "$api" | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')"

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/go/go.mod
          cache-dependency-path: app/src/main/go/go.sum

      # The NDK and CMake build libvoxeldpi.so (the DPI engine) inside the Gradle build.
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools ndk;${{ env.NDK_VERSION }} cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        id: unit
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Report the unit test failure
        if: failure() && steps.unit.outcome == 'failure'
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/unit.log" "Unit tests"

      - name: Unit test totals
        if: always() && steps.unit.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"::notice title=Unit tests::{len(files)} classes, {tests} tests, {failures} failures, {errors} errors, {skipped} skipped")
          PY
          ls -1 app/build/xray-configs 2>/dev/null | sed 's/^/config: /' || true

      - name: Load every generated configuration into Xray-core
        id: xray
        working-directory: app/src/main/go
        env:
          VOXEL_CONFIG_DIR: ${{ github.workspace }}/app/build/xray-configs
        run: |
          set -o pipefail
          go test ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/xray.log"

      - name: Report the Xray configuration failure
        if: failure() && steps.xray.outcome == 'failure'
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/xray.log" "Xray config check"

      - name: Xray config check totals
        if: always() && steps.xray.outcome != 'skipped'
        run: |
          passed="$(grep -c -- '--- PASS' "$RUNNER_TEMP/xray.log" || true)"
          failed="$(grep -c -- '--- FAIL' "$RUNNER_TEMP/xray.log" || true)"
          skipped="$(grep -c -- '--- SKIP' "$RUNNER_TEMP/xray.log" || true)"
          echo "::notice title=Xray config check::$passed passed, $failed failed, $skipped skipped"

      - name: Build the release APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/apk.log"

      - name: Report the build failure
        if: failure() && steps.apk.outcome == 'failure'
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/apk.log" "Release build"

      - name: Inspect the APK
        continue-on-error: true
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          {
            echo "### $(basename "$apk") ($(stat -c %s "$apk") bytes)"
            echo '```'
            "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable-activity|native-code)"
            echo '```'
            echo '```'
            "$tools/apksigner" verify --verbose --print-certs "$apk"
            echo '```'
            echo '```'
            unzip -l "$apk" | grep -E "lib/[^/]+/(libgojni|libvoxeldpi).so|classes[0-9]*.dex|AndroidManifest.xml"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|native-code)" | sed 's/^/::notice title=APK::/'

      # Both native libraries must be in the APK for every ABI, and the DPI library must export the JNI entry
      # points that DpiEngine.kt declares (a misspelled symbol would otherwise only fail on a device).
      - name: Native libraries of the APK
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libgojni.so libvoxeldpi.so; do
              if ! grep -qx "lib/$abi/$lib" "$RUNNER_TEMP/apk-files.txt"; then
                echo "::error title=APK::lib/$abi/$lib is missing from the APK"
                exit 1
              fi
            done
          done
          unzip -p "$apk" lib/x86_64/libvoxeldpi.so > "$RUNNER_TEMP/libvoxeldpi.so"
          nm -D --defined-only "$RUNNER_TEMP/libvoxeldpi.so" | awk '{print $3}' > "$RUNNER_TEMP/exported.txt"
          grep -o 'external fun native[A-Za-z]*' app/src/main/java/com/voxel/vpn/vpn/DpiEngine.kt | sed 's/external fun //' > "$RUNNER_TEMP/declared.txt"
          declared="$(grep -c . "$RUNNER_TEMP/declared.txt" || true)"
          if [ "$declared" -lt 7 ]; then
            echo "::error title=JNI::only $declared native functions found in DpiEngine.kt"
            exit 1
          fi
          while read -r name; do
            if ! grep -qx "Java_com_voxel_vpn_vpn_DpiEngine_$name" "$RUNNER_TEMP/exported.txt"; then
              echo "::error title=JNI::libvoxeldpi.so does not export Java_com_voxel_vpn_vpn_DpiEngine_$name"
              exit 1
            fi
          done < "$RUNNER_TEMP/declared.txt"
          sizes="$(unzip -l "$apk" | awk '/libvoxeldpi.so/ {printf "%s ", $1}')"
          echo "::notice title=Native libraries::libgojni.so and libvoxeldpi.so for arm64-v8a, armeabi-v7a, x86_64; $declared JNI functions exported; libvoxeldpi.so sizes: $sizes"

      - name: Keep the APK for the export and e2e jobs
        uses: actions/cache/save@v6
        with:
          path: app/build/outputs/apk/release/voxel-vpn-release.apk
          key: voxel-vpn-apk-${{ github.run_id }}

      # Best effort: GitHub refuses new artifacts once the repository's artifact storage is used up.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: voxel-vpn-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/lint.log"

      - name: Lint findings
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          reports = glob.glob("app/build/reports/lint-results-debug.xml")
          if not reports:
              print("::notice title=Lint::no report was produced")
          for report in reports:
              issues = ET.parse(report).getroot().findall("issue")
              counts = {}
              for issue in issues:
                  severity = issue.get("severity")
                  counts[severity] = counts.get(severity, 0) + 1
              print(f"::notice title=Lint::{len(issues)} findings {counts}")
              order = {"Fatal": 0, "Error": 1, "Warning": 2}
              ranked = sorted(issues, key=lambda issue: order.get(issue.get("severity"), 3))
              for issue in ranked[:40]:
                  location = issue.find("location")
                  where = ""
                  if location is not None:
                      where = f'{location.get("file", "").split("/app/", 1)[-1]}:{location.get("line", "")}'
                  text = f'{issue.get("severity")} {issue.get("id")}: {issue.get("message")} @ {where}'
                  print("::warning title=Lint finding::" + escape(text))
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/xray-configs
          if-no-files-found: ignore
          retention-days: 7

  export:
    # The APK is also stored as an unreferenced git blob, so it can be fetched with the plain REST API
    # (gh api repos/<owner>/<repo>/git/blobs/<sha> -H 'Accept: application/vnd.github.raw') where the
    # artifact download hosts are not reachable.
    name: Publish the APK as a git blob
    needs: app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the APK
        uses: actions/cache/restore@v6
        with:
          path: app/build/outputs/apk/release/voxel-vpn-release.apk
          key: voxel-vpn-apk-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Upload the blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/voxel-vpn-release.apk"
          mkdir -p "$RUNNER_TEMP/parts"
          # 15 MB pieces keep every request far below the API's body limits; the notice lists them in order.
          split -b 15M -d -a 3 "$apk" "$RUNNER_TEMP/parts/part-"
          shas=""
          for part in "$RUNNER_TEMP"/parts/part-*; do
            python3 - "$part" > "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], "rb") as handle:
              print(json.dumps({"content": base64.b64encode(handle.read()).decode("ascii"), "encoding": "base64"}))
          PY
            if ! sha="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha 2> "$RUNNER_TEMP/gh.err")"; then
              echo "::error title=Blob upload failed::$(head -c 2000 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
              exit 1
            fi
            shas="${shas:+$shas,}$sha"
          done
          echo "::notice title=APK blobs::name=$(basename "$apk") size=$(stat -c %s "$apk") sha256=$(sha256sum "$apk" | cut -d' ' -f1) parts=$shas"
          echo "APK parts: $shas"

  e2e:
    # Boots an Android emulator, installs the release APK and drives it end to end: an incy:// link imports a
    # subscription, the app connects through its VPN tunnel, and a TCP request from the emulator to an address
    # that does not exist must come back through VLESS from the Xray server that runs on this runner.
    # The screenshots and logs are exported as git blobs, like the APK.
    name: Emulator end-to-end (import, connect, traffic through the tunnel)
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      E2E_APK: ${{ github.workspace }}/app/build/outputs/apk/release/voxel-vpn-release.apk
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            echo "::notice title=KVM::/dev/kvm is available ($(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2}') MB RAM)"
          else
            echo "::error title=KVM::/dev/kvm is missing, so the emulator cannot run with hardware acceleration ($(nproc) CPUs)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Fetch the APK
        uses: actions/cache/restore@v6
        with:
          path: app/build/outputs/apk/release/voxel-vpn-release.apk
          key: voxel-vpn-apk-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/go/go.mod
          cache-dependency-path: app/src/main/go/go.sum

      - name: Build the Xray test server
        working-directory: app/src/main/go
        run: go build -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/e2e-server" ./cmd/e2e-server

      - name: Start the test servers
        env:
          E2E_SERVER_BIN: ${{ runner.temp }}/e2e-server
        run: bash .github/scripts/e2e-servers.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The emulator is installed and booted by our own script instead of a marketplace action: it runs with
      # `-accel on` (no silent fall back to software emulation) and reports its own log when a boot fails.
      - name: Install the emulator and a system image
        run: bash .github/scripts/emulator.sh install

      - name: Boot the emulator
        run: bash .github/scripts/emulator.sh boot

      - name: Drive the app on the emulator
        run: bash .github/scripts/e2e.sh

      - name: Test server logs
        if: always()
        run: |
          for log in "$RUNNER_TEMP/e2e/xray.log" "$RUNNER_TEMP/e2e/web.log"; do
            [ -f "$log" ] || continue
            echo "::notice title=$(basename "$log")::$(tail -n 40 "$log" | tail -c 6000 | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
          done

      - name: Export the screenshots and logs as git blobs
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          list=""
          for file in "$E2E_OUT"/*.png "$E2E_OUT"/*.txt; do
            python3 - "$file" > "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], "rb") as handle:
              print(json.dumps({"content": base64.b64encode(handle.read()).decode("ascii"), "encoding": "base64"}))
          PY
            if sha="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha 2> "$RUNNER_TEMP/gh.err")"; then
              list="${list:+$list }$(basename "$file")=$sha"
            else
              echo "::warning title=E2E blob upload failed::$(basename "$file"): $(head -c 500 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            fi
          done
          echo "::notice title=E2E files::$list"

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: e2e-output
          path: e2e-out
          if-no-files-found: ignore
          retention-days: 7
